<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spark.js 3D Gaussian Splatting WebGL 데모</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #11141a;
      color: #f0f4f8;
      user-select: none;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    /* UI Overlay */
    .ui-panel {
      position: absolute;
      z-index: 10;
      background: rgba(18, 22, 34, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    #header-panel {
      top: 16px;
      left: 16px;
      max-width: 380px;
    }
    #header-panel h1 {
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ff5c72 0%, #ff8b3d 50%, #ffd043 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #header-panel p {
      font-size: 0.82rem;
      color: #94a3b8;
      margin-top: 6px;
      line-height: 1.4;
    }
    .badge {
      display: inline-block;
      font-size: 0.68rem;
      background: rgba(255, 92, 114, 0.2);
      color: #ff5c72;
      border: 1px solid rgba(255, 92, 114, 0.4);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      vertical-align: middle;
    }
    #controls-panel {
      top: 16px;
      right: 16px;
      width: 320px;
    }
    .control-group {
      margin-bottom: 14px;
    }
    .control-group:last-child {
      margin-bottom: 0;
    }
    .control-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    select, button, input[type="range"] {
      width: 100%;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f8fafc;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      transition: all 0.2s ease;
    }
    select:hover, button:hover {
      background: #334155;
      border-color: #ff5c72;
      cursor: pointer;
    }
    button.primary {
      background: linear-gradient(135deg, #e11d48, #f97316);
      border: none;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3);
    }
    button.primary:hover {
      box-shadow: 0 6px 16px rgba(225, 29, 72, 0.5);
      transform: translateY(-1px);
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
    }
    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .3s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #e11d48;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    #info-bar {
      bottom: 16px;
      left: 16px;
      font-size: 0.8rem;
      color: #94a3b8;
      display: flex;
      gap: 16px;
    }
    .info-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .info-val {
      color: #38bdf8;
      font-weight: 600;
      font-family: monospace;
    }
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 12, 18, 0.9);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 92, 114, 0.2);
      border-top-color: #ff5c72;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #loading-text {
      font-size: 0.95rem;
      font-weight: 500;
      color: #e2e8f0;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="header-panel" class="ui-panel">
    <h1>✨ Spark.js 3DGS <span class="badge">v2.1.0 WebGL</span></h1>
    <p>Three.js 환경에서 실시간 3D Gaussian Splatting과 일반 3D 폴리곤 메시가 결합된 WebGL 인터랙티브 데모입니다.</p>
  </div>

  <div id="controls-panel" class="ui-panel">
    <div class="control-group">
      <label class="control-label" for="model-select">3D 가우시안 모델 선택</label>
      <select id="model-select">
        <option value="butterfly.spz">🦋 나비 (Butterfly SPZ)</option>
        <option value="woobles.spz">🐧 우블스 캐릭터 (Woobles)</option>
        <option value="cat.spz">🐱 귀여운 고양이 (Cat)</option>
        <option value="robot-head.spz">🤖 로봇 헤드 (Robot Head)</option>
        <option value="dessert.spz">🍰 디저트 케이크 (Dessert)</option>
        <option value="food/burger-from-amboy.spz">🍔 햄버거 (Burger)</option>
      </select>
    </div>

    <div class="control-group">
      <div class="toggle-row">
        <span class="control-label" style="margin:0;">자동 회전 (Auto Rotate)</span>
        <label class="toggle-switch">
          <input type="checkbox" id="auto-rotate" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="control-group">
      <div class="toggle-row">
        <span class="control-label" style="margin:0;">Three.js 토러스 매듭 (Mesh 가림 확인)</span>
        <label class="toggle-switch">
          <input type="checkbox" id="toggle-mesh" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="control-group">
      <label class="control-label" for="splat-scale">
        스플랫 스케일: <span id="scale-val" class="info-val">1.0x</span>
      </label>
      <input type="range" id="splat-scale" min="0.2" max="2.5" step="0.05" value="1.0">
    </div>

    <div class="control-group">
      <label class="control-label" for="splat-opacity">
        투명도 (Opacity): <span id="opacity-val" class="info-val">1.0</span>
      </label>
      <input type="range" id="splat-opacity" min="0.1" max="1.0" step="0.05" value="1.0">
    </div>

    <div class="control-group">
      <button id="btn-recolor" class="primary">🎨 랜덤 틴트 컬러 변경</button>
    </div>
  </div>

  <div id="info-bar" class="ui-panel">
    <div class="info-item">
      <span>FPS:</span>
      <span id="fps-counter" class="info-val">60</span>
    </div>
    <div class="info-item">
      <span>스플랫 수:</span>
      <span id="splat-count" class="info-val">로딩 중...</span>
    </div>
    <div class="info-item">
      <span>조작:</span>
      <span style="color:#cbd5e1;">좌클릭 드래그(회전), 우클릭/두손가락(이동), 휠(줌)</span>
    </div>
  </div>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">3D Gaussian Splats 로딩 및 디코딩 중...</div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

    const container = document.getElementById("canvas-container");
    const loadingOverlay = document.getElementById("loading-overlay");
    const loadingText = document.getElementById("loading-text");
    const splatCountEl = document.getElementById("splat-count");
    const fpsCounterEl = document.getElementById("fps-counter");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0e121a);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.2, 3.2);

    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const spark = new SparkRenderer({
      renderer: renderer,
      sortRadial: true,
      lodSplatScale: 1.0,
      enableLod: true
    });
    scene.add(spark);

    const gridHelper = new THREE.GridHelper(10, 20, 0xff5c72, 0x273549);
    gridHelper.position.y = -0.8;
    scene.add(gridHelper);

    const torusGeo = new THREE.TorusKnotGeometry(0.35, 0.1, 100, 16);
    const torusMat = new THREE.MeshStandardMaterial({
      color: 0x38bdf8,
      roughness: 0.3,
      metalness: 0.8
    });
    const torusMesh = new THREE.Mesh(torusGeo, torusMat);
    torusMesh.position.set(1.4, 0.3, -0.4);
    scene.add(torusMesh);

    const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);
    const ambLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambLight);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0, 0);

    let currentSplatMesh = null;
    const baseAssetUrl = "https://sparkjs.dev/assets/splats/";

    async function loadSplatModel(filename) {
      loadingOverlay.style.display = "flex";
      loadingOverlay.style.opacity = "1";
      loadingText.textContent = `${filename} 스플랫 데이터 로딩 중...`;

      if (currentSplatMesh) {
        scene.remove(currentSplatMesh);
        currentSplatMesh.dispose();
        currentSplatMesh = null;
      }

      try {
        const fullUrl = baseAssetUrl + filename;
        const splatMesh = new SplatMesh({
          url: fullUrl,
          lod: true,
          onProgress: (ev) => {
            if (ev.lengthComputable) {
              const pct = Math.round((ev.loaded / ev.total) * 100);
              loadingText.textContent = `${filename} 다운로드 중: ${pct}%`;
            }
          }
        });

        splatMesh.quaternion.set(1, 0, 0, 0);
        splatMesh.position.set(0, 0, 0);

        scene.add(splatMesh);
        currentSplatMesh = splatMesh;

        await splatMesh.initialized;

        const count = splatMesh.numSplats || (splatMesh.packedSplats ? splatMesh.packedSplats.numSplats : 0);
        splatCountEl.textContent = `${count.toLocaleString()} 개`;

        loadingOverlay.style.opacity = "0";
        setTimeout(() => {
          loadingOverlay.style.display = "none";
        }, 400);
      } catch (err) {
        console.error("SplatMesh 로드 실패:", err);
        loadingText.textContent = `로드 오류: ${err.message}`;
      }
    }

    loadSplatModel("butterfly.spz");

    const modelSelect = document.getElementById("model-select");
    modelSelect.addEventListener("change", (e) => {
      loadSplatModel(e.target.value);
    });

    const autoRotateCheck = document.getElementById("auto-rotate");
    const toggleMeshCheck = document.getElementById("toggle-mesh");
    toggleMeshCheck.addEventListener("change", (e) => {
      torusMesh.visible = e.target.checked;
    });

    const scaleInput = document.getElementById("splat-scale");
    const scaleVal = document.getElementById("scale-val");
    scaleInput.addEventListener("input", (e) => {
      const val = parseFloat(e.target.value);
      scaleVal.textContent = `${val.toFixed(2)}x`;
      if (currentSplatMesh) {
        currentSplatMesh.scale.setScalar(val);
      }
    });

    const opacityInput = document.getElementById("splat-opacity");
    const opacityVal = document.getElementById("opacity-val");
    opacityInput.addEventListener("input", (e) => {
      const val = parseFloat(e.target.value);
      opacityVal.textContent = val.toFixed(2);
      if (currentSplatMesh) {
        currentSplatMesh.opacity = val;
      }
    });

    const btnRecolor = document.getElementById("btn-recolor");
    btnRecolor.addEventListener("click", () => {
      if (currentSplatMesh) {
        const r = 0.5 + Math.random() * 0.5;
        const g = 0.5 + Math.random() * 0.5;
        const b = 0.5 + Math.random() * 0.5;
        currentSplatMesh.recolor.setRGB(r, g, b);
      }
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    let frameCount = 0;
    let lastFpsTime = performance.now();
    let lastTime = performance.now();

    renderer.setAnimationLoop((time) => {
      const delta = (time - lastTime) / 1000;
      lastTime = time;

      frameCount++;
      if (time - lastFpsTime >= 500) {
        const fps = Math.round((frameCount * 1000) / (time - lastFpsTime));
        fpsCounterEl.textContent = fps;
        frameCount = 0;
        lastFpsTime = time;
      }

      if (torusMesh.visible) {
        torusMesh.rotation.x += delta * 0.8;
        torusMesh.rotation.y += delta * 0.5;
      }

      if (autoRotateCheck.checked && currentSplatMesh) {
        currentSplatMesh.rotation.y += delta * 0.5;
      }

      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
