<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1324"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#172b4d" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <pattern id="majorGrid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect width="800" height="500" fill="url(#majorGrid)"/>

  <!-- Outer Walls -->
  <rect x="40" y="40" width="720" height="420" fill="none" stroke="#00f0ff" stroke-width="2.5" opacity="0.85"/>
  <rect x="44" y="44" width="712" height="412" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3" stroke-dasharray="4,4"/>

  <!-- Title Block -->
  <g transform="translate(560, 400)">
    <rect width="190" height="52" fill="#0c1a30" stroke="#00f0ff" stroke-width="1.2" opacity="0.9"/>
    <text x="12" y="20" fill="#00f0ff" font-family="monospace" font-size="11" font-weight="bold">CAD ARCH-DWG: WH-702</text>
    <text x="12" y="34" fill="#94a3b8" font-family="sans-serif" font-size="9">SMART MEGA-LOGISTICS HUB</text>
    <text x="12" y="46" fill="#38bdf8" font-family="sans-serif" font-size="8">SCALE 1:250 | AREA: 1,850m²</text>
  </g>

  <!-- Grid Columns -->
  <g fill="#00f0ff" opacity="0.7">
    <circle cx="120" cy="110" r="3.5"/><circle cx="280" cy="110" r="3.5"/><circle cx="440" cy="110" r="3.5"/><circle cx="600" cy="110" r="3.5"/>
    <circle cx="120" cy="250" r="3.5"/><circle cx="280" cy="250" r="3.5"/><circle cx="440" cy="250" r="3.5"/><circle cx="600" cy="250" r="3.5"/>
    <circle cx="120" cy="380" r="3.5"/><circle cx="280" cy="380" r="3.5"/><circle cx="440" cy="380" r="3.5"/><circle cx="600" cy="380" r="3.5"/>
  </g>

  <!-- High-Bay Pallet Racks (Aisle Rows) -->
  <g fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1.3">
    <!-- Row 1 -->
    <rect x="150" y="80" width="380" height="32" rx="2"/>
    <line x1="210" y1="80" x2="210" y2="112" stroke="#38bdf8" stroke-width="0.8"/>
    <line x1="270" y1="80" x2="270" y2="112" stroke="#38bdf8" stroke-width="0.8"/>
    <line x1="330" y1="80" x2="330" y2="112" stroke="#38bdf8" stroke-width="0.8"/>
    <line x1="390" y1="80" x2="390" y2="112" stroke="#38bdf8" stroke-width="0.8"/>
    <line x1="450" y1="80" x2="450" y2="112" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="160" y="100" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">RACK BAY 01-A (5-TIER)</text>

    <!-- Row 2 -->
    <rect x="150" y="140" width="380" height="32" rx="2"/>
    <line x1="210" y1="140" x2="210" y2="172" stroke="#38bdf8" stroke-width="0.8"/>
    <line x1="270" y1="140" x2="270" y2="172" stroke="#38bdf8" stroke-width="0.8"/>
    <line x1="330" y1="140" x2="330" y2="172" stroke="#38bdf8" stroke-width="0.8"/>
    <line x1="390" y1="140" x2="390" y2="172" stroke="#38bdf8" stroke-width="0.8"/>
    <line x1="450" y1="140" x2="450" y2="172" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="160" y="160" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">RACK BAY 01-B (5-TIER)</text>

    <!-- Row 3 -->
    <rect x="150" y="240" width="380" height="32" rx="2"/>
    <text x="160" y="260" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">RACK BAY 02-A (HEAVY CARGO)</text>

    <!-- Row 4 -->
    <rect x="150" y="300" width="380" height="32" rx="2"/>
    <text x="160" y="320" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">RACK BAY 02-B (HEAVY CARGO)</text>
  </g>

  <!-- AGV High-Speed Runway (Central Path) -->
  <g stroke="#00f0ff" stroke-width="1.8" stroke-dasharray="6,4">
    <path d="M 80 205 L 700 205" fill="none" opacity="0.85"/>
    <path d="M 80 365 L 700 365" fill="none" opacity="0.6"/>
  </g>
  <rect x="300" y="195" width="80" height="20" fill="#00f0ff" fill-opacity="0.15" stroke="#00f0ff" stroke-width="1" rx="4"/>
  <text x="340" y="209" fill="#00f0ff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">AGV FAST LANE 4.2m</text>

  <!-- Loading Docks (Left Side) -->
  <g fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.4">
    <rect x="40" y="80" width="55" height="60"/>
    <text x="67" y="115" fill="#10b981" font-family="monospace" font-size="9" text-anchor="middle">DOCK 1</text>
    <rect x="40" y="160" width="55" height="60"/>
    <text x="67" y="195" fill="#10b981" font-family="monospace" font-size="9" text-anchor="middle">DOCK 2</text>
    <rect x="40" y="240" width="55" height="60"/>
    <text x="67" y="275" fill="#10b981" font-family="monospace" font-size="9" text-anchor="middle">DOCK 3</text>
  </g>

  <!-- Sorting & Inspection Zone (Right Side) -->
  <g fill="rgba(244, 63, 94, 0.1)" stroke="#f43f5e" stroke-width="1.4">
    <rect x="580" y="80" width="150" height="150" rx="4"/>
    <text x="655" y="120" fill="#f43f5e" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SORTING &amp; QC</text>
    <text x="655" y="140" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">VISION AI CAMERA</text>
    <rect x="600" y="160" width="110" height="50" fill="none" stroke="#f43f5e" stroke-width="1" stroke-dasharray="3,3"/>
  </g>

  <!-- Dimension Lines -->
  <g stroke="#64748b" stroke-width="0.8">
    <line x1="40" y1="25" x2="760" y2="25"/>
    <line x1="40" y1="20" x2="40" y2="30"/>
    <line x1="760" y1="20" x2="760" y2="30"/>
    <text x="400" y="21" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">50,000 mm (50.0m)</text>

    <line x1="20" y1="40" x2="20" y2="460"/>
    <line x1="15" y1="40" x2="25" y2="40"/>
    <line x1="15" y1="460" x2="25" y2="460"/>
    <text x="18" y="255" fill="#64748b" font-family="monospace" font-size="10" transform="rotate(-90 18 255)" text-anchor="middle">35,000 mm (35.0m)</text>
  </g>
</svg>
