<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="thumbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051c2c"/>
      <stop offset="100%" stop-color="#020b12"/>
    </linearGradient>
    <pattern id="thumbGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#00f0ff" stroke-width="0.5" opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="320" height="180" fill="url(#thumbBg)"/>
  <rect width="320" height="180" fill="url(#thumbGrid)"/>

  <!-- Blueprint Schematic Graphic -->
  <rect x="25" y="20" width="270" height="140" rx="6" fill="rgba(0,240,255,0.05)" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="45" y="40" width="90" height="45" rx="3" fill="rgba(56,189,248,0.2)" stroke="#38bdf8" stroke-width="1.2"/>
  <rect x="150" y="40" width="125" height="45" rx="3" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="1.2"/>
  <circle cx="90" cy="120" r="24" fill="rgba(217,70,239,0.2)" stroke="#d946ef" stroke-width="1.2"/>
  <line x1="130" y1="120" x2="275" y2="120" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Holographic Scanner Line -->
  <line x1="20" y1="90" x2="300" y2="90" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>

  <!-- Badge -->
  <rect x="195" y="132" width="100" height="22" rx="4" fill="#00f0ff" fill-opacity="0.2" stroke="#00f0ff" stroke-width="1"/>
  <text x="245" y="147" fill="#00f0ff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">SKETCH-TO-3D</text>
</svg>
