<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="srBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14081c"/>
      <stop offset="100%" stop-color="#07020d"/>
    </linearGradient>
    <pattern id="srGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2a123d" stroke-width="0.7" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#srBg)"/>
  <rect width="800" height="500" fill="url(#srGrid)"/>

  <!-- Showroom Perimeter -->
  <rect x="40" y="40" width="720" height="420" fill="none" stroke="#d946ef" stroke-width="2.5" opacity="0.85"/>

  <!-- Title Block -->
  <g transform="translate(560, 400)">
    <rect width="190" height="52" fill="#1b0826" stroke="#d946ef" stroke-width="1.2" opacity="0.9"/>
    <text x="12" y="20" fill="#d946ef" font-family="monospace" font-size="11" font-weight="bold">AUTO ARCH-DWG: SR-900</text>
    <text x="12" y="34" fill="#f0abfc" font-family="sans-serif" font-size="9">HYPER-CAR SHOWROOM &amp; DYNO</text>
    <text x="12" y="46" fill="#94a3b8" font-family="sans-serif" font-size="8">360° TURNTABLE | VIP LOUNGE</text>
  </g>

  <!-- Central 360° Turntable Stage -->
  <g fill="rgba(217, 70, 239, 0.12)" stroke="#d946ef" stroke-width="2">
    <circle cx="320" cy="240" r="130"/>
    <circle cx="320" cy="240" r="100" stroke-dasharray="6,4" fill="none"/>
    <circle cx="320" cy="240" r="30" fill="rgba(217,70,239,0.25)"/>
    <text x="320" y="235" fill="#f0abfc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ROTATING TURNTABLE</text>
    <text x="320" y="252" fill="#e2e8f0" font-family="monospace" font-size="9" text-anchor="middle">Ø 7.2m | AUDI R8 V10</text>
  </g>

  <!-- High-Gloss Epoxy Runway -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5,4">
    <line x1="40" y1="240" x2="190" y2="240"/>
    <text x="110" y="232" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">CAR DRIVE-IN LANE</text>
  </g>

  <!-- Dyno Performance & Telemetry Pit -->
  <g fill="rgba(244, 63, 94, 0.12)" stroke="#f43f5e" stroke-width="1.5">
    <rect x="520" y="70" width="220" height="150" rx="4"/>
    <text x="630" y="105" fill="#f43f5e" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">DYNO CHASSIS TEST LAB</text>
    <rect x="550" y="130" width="160" height="60" fill="rgba(244,63,94,0.2)" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="630" y="165" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">ALL-WHEEL ROLLER TEST BED</text>
  </g>

  <!-- VIP Atelier Lounge -->
  <g fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1.5">
    <rect x="520" y="250" width="220" height="130" rx="4"/>
    <text x="630" y="285" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">BESPOKE CLIENT LOUNGE</text>
    <text x="630" y="305" fill="#a7f3d0" font-family="sans-serif" font-size="9" text-anchor="middle">SPECIFICATION &amp; COLOR LAB</text>
    <circle cx="580" cy="340" r="16" fill="none" stroke="#10b981" stroke-width="1"/>
    <circle cx="680" cy="340" r="16" fill="none" stroke="#10b981" stroke-width="1"/>
  </g>
</svg>
